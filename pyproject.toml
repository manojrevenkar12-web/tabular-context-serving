[project]
name = "tabular-context-serving"
version = "1.0.0"
description = "Serving plane for in-context tabular foundation models"
requires-python = ">=3.11"

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
