[memory]
headroom_share = 0.95          # of nominal HBM the plane starts out believing it may use
safety_quantile = 0.98         # of measured/predicted transient memory, over the window
window = 300
min_samples = 12
oom_backoff = 0.97             # usable-capacity estimate after an out-of-memory error
min_capacity_share = 0.6       # never plan on less than this share of a card's nominal memory
cache_budget_share = 0.7       # of usable memory that resident caches may take (LRU designs)

[chunking]
test_ladder = [1000000000, 16384, 8192, 4096, 2048, 1024, 512, 256]
train_ladder = [1000000000, 16384, 8192, 4096, 2048, 1024, 512, 256]

[batching]
max_test_rows = 40000

[routing]
slo_margin = 0.5               # route for cost only among GPUs expected to finish within this share of the SLO left

[queue]
fairness_halflife_s = 600.0

[quota]
gpu_seconds_per_hour = 1500.0
burst_gpu_seconds = 900.0

[retry]
max_attempts = 3

[timing]
learning_rate = 0.1

[advisor]
planning_margin = 0.01         # plan a pool for the SLO target plus this, to absorb what the replay cannot see
