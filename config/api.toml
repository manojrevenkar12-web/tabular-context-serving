# The HTTP API on one worker running the small PyTorch model. Keys are stored as SHA-256 hashes; the tenant comes
# from the key, never from the request body. These two are development keys ("dev-key-acme", "dev-key-globex").

[[keys]]
sha256 = "e95d4bb62790bca88762e968e6ab1d23fb79d1db4f900d22414fb258db1f606a"
tenant = "acme"

[[keys]]
sha256 = "e94a1d03c864e2f9ba4ec901360ea78ad661202b7e54e2000ceca101d6856103"
tenant = "globex"

[limits]
max_rows = 200000
max_features = 2000
max_test_rows = 50000

# The plane's view of this single worker, and its prior for the small model (estimators = 1: one forward pass).
[fleet]
name = "cpu-0"
kind = "cpu"
hbm_bytes = 2.0e9
speed = 1.0
eur_per_hour = 0.1
host_bytes = 4.0e9

[prior]
estimators = 1
cache_bytes_per_row = 2048.0
cache_bytes_per_cell = 0.0
fit_bytes_per_cell = 0.0
fit_bytes_per_chunk_unit = 16.0
predict_bytes_per_unit = 16.0
weights_bytes = 1.0e6
fit_s_per_cell = 1.0e-7
fit_s_per_row_pow = 1.0e-7
row_exponent = 1.3
predict_s_per_unit = 1.0e-7
job_overhead_s = 0.001
chunk_overhead_s = 0.0005
pcie_bytes_per_s = 5.0e9
