# The serving plane's settings. The world never reads this file.

[model]
estimators = 8

# What the team believes from its own benchmarks. Deliberately not the truth: the plane corrects these from the
# telemetry every worker reports (measured peak memory, cache size, seconds, out-of-memory errors).
[prior]
cache_bytes_per_row = 4000.0
cache_bytes_per_cell = 16.0
fit_bytes_per_cell = 36.0
fit_bytes_per_chunk_unit = 56.0
predict_bytes_per_unit = 90.0
weights_bytes = 2.2e9
fit_s_per_cell = 2.7e-7
fit_s_per_row_pow = 1.4e-7
row_exponent = 1.3
predict_s_per_unit = 4.5e-7
job_overhead_s = 0.04
chunk_overhead_s = 0.002
pcie_bytes_per_s = 1.6e10

# The inventory the plane schedules on. It knows each card's nominal memory and speed, not what the driver and
# allocator take.
[[fleet]]
name = "h100-0"
kind = "h100"
hbm_bytes = 8.0e10
speed = 1.0
eur_per_hour = 10.0
host_bytes = 2.0e11

