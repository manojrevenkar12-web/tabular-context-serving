host_bytes = 6.4e10

[[gpu]]
name = "l4-3"
kind = "l4"
hbm_bytes = 2.4e10
speed = 0.18
eur_per_hour = 0.85
reserved_share = 0.09
host_bytes = 6.4e10

[traffic]
tenants = 36
sessions_per_hour = 340.0
predicts_per_session_mean = 7.0
session_minutes_mean = 40.0
rows_min = 1000
rows_max = 1000000
rows_pareto_alpha = 0.55          # share of large contexts
features_min = 5
features_max = 200
test_rows_min = 1
test_rows_max = 20000
interactive_share = 0.6           # predicts of <= 500 rows, the client waits
retry_share = 0.03                # client resends with the same idempotency key
retry_delay_s = 4.0
flood_tenant_share = 0.28         # one tenant sends this share of sessions in bursts
flood_burst_minutes = 25.0
flood_predicts_multiplier = 2.5
erasure_tenants = 3
after_erasure_requests = 6        # requests the erased tenant's old jobs still send

[slo]
interactive_s = 3.0
interactive_s_per_100k_train_rows = 4.0
batch_s_base = 30.0
batch_s_per_k_test_rows = 1.5
batch_s_per_100k_train_rows = 6.0
